<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Hitmen identity test</title>
<style>body{font:16px system-ui;background:#101820;color:#f5f7fa;max-width:1000px;margin:40px auto;padding:20px}input,button{font:inherit;padding:10px;margin:5px}button{cursor:pointer;background:#ffbf47;border:0;border-radius:5px}button:disabled{cursor:default;opacity:.6}article{border:1px solid #526170;padding:20px;margin:20px 0;border-radius:10px}small{color:#c6d0db}pre{white-space:pre-wrap;overflow-wrap:anywhere}h1{font-size:30px}table{width:100%;border-collapse:collapse;margin:15px 0}th,td{text-align:left;padding:8px;border-bottom:1px solid #526170}details{margin-top:20px}ul{padding-left:20px}@media(max-width:600px){body{margin:0;padding:14px}article{padding:12px}table{font-size:13px}th,td{padding:5px}}</style>
<h1>Hitmen identity test</h1><p>Separate test reviews. Production scouting reports stay protected. Coverage is measured against all 12 players on each game's final LG sheet.</p>
<label>Test access code <input id="key" type="password" autocomplete="off"></label><button id="open">Open tests</button><p id="status" role="status"></p><main id="games"></main>
<script>
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function api(url,body){const r=await fetch(url,{method:body?'POST':'GET',headers:{Authorization:'Bearer '+$('#key').value,'Content-Type':'application/json'},body:body?JSON.stringify(body):undefined});const data=await r.json();if(!r.ok)throw Error(data.error);return data;}
async function refresh(id,el){try{
 const d=await api('/api/games/'+id),a=d.identity_audit,s=d.job?.status||d.status;
 const labels={ready_for_review:'Ready for your review',failed:'Needs attention',processing:'Analysing video',retrieving:'Loading recording',saved_evidence_identity_check:'Saved evidence identity check',not_started:'Not started'};
 const unresolved=[...new Set((a?.unresolved||[]).map(p=>p.source.player))];
 el.innerHTML=`<p><strong>${esc(labels[s]||s)}</strong>${d.job?.error?' · '+esc(d.job.error):''}</p>${d.game.identity_replay?'<p>This checks identities against saved evidence. It does not rerun the video or create new performance findings.</p>':''}${a?`<p>${a.attributed_players} of ${a.expected_players} players have linked observations. ${a.unresolved_name_count} names still need verification.</p><table><thead><tr><th>Player</th><th>Position</th><th>Evidence</th></tr></thead><tbody>${a.coverage.map(p=>`<tr><td>${esc(p.player)}<br><small>${esc(p.team)}</small></td><td>${esc(p.position)}</td><td>${p.evidence_status==='attributed_report'?'Linked observations':'No linked observations yet'}</td></tr>`).join('')}</tbody></table><p><strong>Names grouped into one player report</strong></p><ul>${a.canonical_reports.filter(p=>p.source_names.length>1).map(p=>`<li>${esc(p.source_names.join(' / '))} · LG ${esc(p.lg_user_id)}</li>`).join('')||'<li>No additional verified aliases in this result.</li>'}</ul>${unresolved.length?'<p><strong>Names needing verification:</strong> '+esc(unresolved.join(', '))+'</p>':''}<p><small>A missing observation is not a poor rating. Duplicate citations across periods are not separate plays.</small></p><details><summary>Evidence details</summary><pre>${esc(JSON.stringify(a,null,2))}</pre></details>`:''}`;
 }catch(e){el.textContent=e.message;}}
$('#open').onclick=async()=>{try{
 const d=await api('/api/games');$('#games').replaceChildren();
 for(const g of d.games){
  const card=document.createElement('article');
  card.innerHTML=`<h2>${esc(g.title)}</h2><small>LG game ${g.lg_game_id} · ${g.players.length} verified participants · Separate test review</small><p>Names without a verified link stay unresolved. Players with no observed evidence receive no performance rating.</p><button class="start">${g.identity_replay?'Saved evidence check':'Start separate VOD analysis'}</button><button class="refresh">Refresh results</button><div class="result" aria-live="polite"></div>`;
  const result=card.querySelector('.result'),start=card.querySelector('.start');start.disabled=Boolean(g.identity_replay);
  card.querySelector('.refresh').onclick=()=>refresh(g.lg_game_id,result);
  start.onclick=async e=>{e.target.disabled=true;try{await api('/api/games/'+g.lg_game_id+'/start',{});await refresh(g.lg_game_id,result);}catch(err){result.textContent=err.message;}finally{e.target.disabled=false;}};
  $('#games').append(card);await refresh(g.lg_game_id,result);
 }
 $('#status').textContent='Test access open. Refresh results to see progress.';
 }catch(e){$('#status').textContent=e.message;}};
</script></html>
