<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Hitmen identity test</title>
<style>body{font:16px system-ui;background:#101820;color:#f5f7fa;max-width:1000px;margin:40px auto;padding:20px}input,button{font:inherit;padding:10px;margin:5px}button{cursor:pointer;background:#ffbf47;border:0;border-radius:5px}article{border:1px solid #526170;padding:20px;margin:20px 0;border-radius:10px}small{color:#c6d0db}pre{white-space:pre-wrap;overflow-wrap:anywhere}h1{font-size:30px}</style>
<h1>Hitmen identity test</h1><p>Separate test reviews. Production scouting reports stay protected. Coverage is measured against all 12 players on each game's final LG sheet.</p>
<label>Test access code <input id="key" type="password" autocomplete="off"></label><button id="open">Open tests</button><p id="status" role="status"></p><main id="games"></main>
<script>
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function api(url,body){const r=await fetch(url,{method:body?'POST':'GET',headers:{Authorization:'Bearer '+$('#key').value,'Content-Type':'application/json'},body:body?JSON.stringify(body):undefined});const data=await r.json();if(!r.ok)throw Error(data.error);return data;}
async function refresh(id,el){try{const d=await api('/api/games/'+id),a=d.identity_audit;el.textContent=JSON.stringify({status:d.job?.status||d.status,error:d.job?.error||undefined,coverage:a?`${a.attributed_players}/${a.expected_players} players attributed; ${a.unresolved_name_count} unresolved names`:undefined,players:a?.coverage,canonical_reports:a?.canonical_reports,unresolved:a?.unresolved,limitation:a?.limitation},null,2);}catch(e){el.textContent=e.message;}}
$('#open').onclick=async()=>{try{const d=await api('/api/games');$('#games').replaceChildren();for(const g of d.games){const card=document.createElement('article');card.innerHTML=`<h2>${esc(g.title)}</h2><small>LG game ${g.lg_game_id} · ${g.players.length} verified participants · New test review</small><p>Names without a verified link stay unresolved. Players with no observed evidence receive no performance rating.</p><button class="start">Start separate VOD analysis</button><button class="refresh">Refresh results</button><pre></pre>`;const pre=card.querySelector('pre');card.querySelector('.refresh').onclick=()=>refresh(g.lg_game_id,pre);card.querySelector('.start').onclick=async e=>{e.target.disabled=true;try{await api('/api/games/'+g.lg_game_id+'/start',{});await refresh(g.lg_game_id,pre);}catch(err){pre.textContent=err.message;}finally{e.target.disabled=false;}};$('#games').append(card);await refresh(g.lg_game_id,pre);}$('#status').textContent='Test access open. Refresh results to see progress.';}catch(e){$('#status').textContent=e.message;}};
</script></html>
