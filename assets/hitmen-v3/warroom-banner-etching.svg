<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 260" role="img" aria-label="Abstract engraved hockey arena roof, crossed sticks, and Calgary-style skyline">
<defs>
 <linearGradient id="night" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#090b10"/><stop offset=".48" stop-color="#160c14"/><stop offset="1" stop-color="#090a0e"/></linearGradient>
 <linearGradient id="ice" x1="0" x2="0" y1="0" y2="1"><stop stop-color="#c2c5cb" stop-opacity=".24"/><stop offset="1" stop-color="#6b727b" stop-opacity=".035"/></linearGradient>
 <linearGradient id="red" x1="0" x2="1"><stop stop-color="#ff2758" stop-opacity=".05"/><stop offset=".5" stop-color="#f51b51" stop-opacity=".27"/><stop offset="1" stop-color="#fa2d64" stop-opacity=".04"/></linearGradient>
 <pattern id="grain" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M0 23h24 M23 0v24" stroke="#aab0b7" opacity=".043" stroke-width="1"/></pattern>
 <pattern id="rivet" width="90" height="250" patternUnits="userSpaceOnUse"><circle cx="3" cy="5" r="2" fill="#8c8a91" opacity=".4"/><circle cx="3" cy="5" r=".6" fill="#191b21"/></pattern>
</defs>
<rect width="1440" height="260" fill="url(#night)"/><rect width="1440" height="260" fill="url(#grain)"/>
<!-- The angular rafters and steel beams form an original abstract arena silhouette. -->
<g stroke="#c6c5cc" stroke-width="3" fill="none" opacity=".14">
 <path d="M0 45L240 5H1200L1440 45 M0 75L290 22H1150L1440 75 M0 100L320 31H1120L1440 100"/>
 <path d="M105 0L405 144 M1335 0L1035 144 M300 0L550 144 M1140 0L890 144"/>
 <path d="M0 224L310 110H1130L1440 224"/>
</g>
<!-- A giant faded faceoff circle reads as a hockey mark, not another fake team logo. -->
<g fill="none" stroke="#b1b5be" opacity=".145">
 <ellipse cx="720" cy="130" rx="330" ry="184" stroke-width="10"/>
 <ellipse cx="720" cy="130" rx="269" ry="145" stroke-width="2"/>
 <path d="M720 -40V310 M380 130H1060" stroke-width="4"/>
 <path d="M605 96V163 M835 96V163 M680 60H760 M680 195H760" stroke-width="4"/>
</g>
<path d="M650 0L745 260H706L610 0Z M797 0L700 260H747L842 0Z" fill="url(#red)" opacity=".33"/>
<!-- Crossed sticks, deliberately faint behind text and logos. -->
<g transform="translate(0 -10)" fill="none" stroke="#dadee2" stroke-linecap="round" opacity=".14">
 <path d="M54 219L334 29 M78 230L355 41 M62 222Q44 241 28 227L19 215" stroke-width="6"/>
 <path d="M49 38L337 227 M64 27L357 215 M345 232q28 11 40-5l2-12" stroke-width="6"/>
</g>
<g transform="translate(1440 0) scale(-1 1)" fill="none" stroke="#dadee2" stroke-linecap="round" opacity=".14">
 <path d="M54 219L334 29 M78 230L355 41 M62 222Q44 241 28 227L19 215" stroke-width="6"/>
 <path d="M49 38L337 227 M64 27L357 215 M345 232q28 11 40-5l2-12" stroke-width="6"/>
</g>
<!-- Neutral skyline silhouette with one taller observation-tower geometry. -->
<g fill="url(#ice)" opacity=".6">
 <path d="M0 235V195H31V163H52V188H76V172H106V186H126V201H152V150H184V172H207V185H236V153H269V178H284V205H315V176H339V192H371V230Z"/>
 <path d="M1060 230V185H1094V198H1115V163H1142V181H1154V204H1172V170H1195V185H1220V147H1241V177H1263V194H1284V168H1310V191H1330V177H1366V196H1396V164H1440V235Z"/>
 <path d="M1144 173V118H1154V105H1170V118H1178V173Z"/>
</g>
<g fill="none" stroke="#e9ecf2" opacity=".08"><path d="M0 250H1440 M0 254H1440" stroke-width="3"/></g>
<path d="M0 256H1440" stroke="url(#red)" stroke-width="5"/>
<rect width="1440" height="260" fill="url(#rivet)"/>
</svg>