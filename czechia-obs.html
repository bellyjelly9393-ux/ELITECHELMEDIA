<style>
@font-face{font-family:CardDisplay;src:url('/assets/fonts/Kanit-BlackItalic.woff') format('woff');font-display:swap}
@font-face{font-family:CardLabel;src:url('/assets/fonts/Teko.woff') format('woff');font-display:swap}
*{box-sizing:border-box}body{margin:0;background:#080f1d;color:#f2f6ff;font-family:Arial,sans-serif;overflow:hidden}
#stage{position:absolute;width:1920px;height:1080px;transform-origin:0 0;background:radial-gradient(ellipse at 36% 0%,#254676,transparent 49%),linear-gradient(130deg,#101d33,#080f1d 62%,#231523);padding:54px 74px}
header{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #60708a;padding-bottom:17px;font-weight:800;letter-spacing:4px;font-size:24px}
header strong{display:flex;align-items:center;gap:22px}header img{width:116px;height:65px;object-fit:contain}header span,footer span{color:#b0c2dd}.hero{display:grid;grid-template-columns:1fr 86px 1fr;align-items:center;margin:30px 0 28px;gap:22px}.hero h1{font-size:88px;margin:0;letter-spacing:-4px;line-height:1}.hero h1:last-child{text-align:right}.hero b{text-align:center;color:#9fb0ca;font-size:27px;letter-spacing:2px}
.flag{width:80px;height:48px;position:relative;margin-bottom:18px;background:linear-gradient(white 50%,#d71435 50%)}.flag:after{content:"";position:absolute;border-left:37px solid #11457e;border-top:24px solid transparent;border-bottom:24px solid transparent}
#opponent{overflow-wrap:anywhere}.grid{display:grid;grid-template-columns:1fr 1fr;gap:26px}.lineup{background:#111e32;border:1px solid #425677;border-top:5px solid #e33b51;min-height:430px;padding:25px 30px}.lineup:last-child{border-top-color:#76a9f3}
h2{font-size:24px;letter-spacing:3px;text-transform:uppercase;margin:0 0 18px;color:#b9cbe6}.row{display:grid;grid-template-columns:95px 1fr;align-items:center;min-height:54px;border-top:1px solid #34445f;gap:12px;font-size:30px;font-weight:700}.row span:first-child{font-size:22px;letter-spacing:2px;color:#a8c2e8}.waiting{margin:26px 0;color:#b9cbe6;font-size:29px}
footer{position:absolute;bottom:50px;left:74px;right:74px;display:flex;justify-content:space-between;border-top:1px solid #60708a;padding-top:22px;font-size:22px;font-weight:800;letter-spacing:3px}
#setup{position:fixed;z-index:1;inset:0;margin:auto;width:min(650px,94vw);height:max-content;max-height:94vh;overflow:auto;padding:28px;background:#101d31;border:1px solid #7990b4;box-shadow:0 0 0 100vmax #000a}
#setup h2{color:white}label{display:block;margin-top:12px}input,textarea,button{font:inherit}input,textarea{display:block;width:100%;padding:8px;margin-top:5px;color:white;background:#081224;border:1px solid #63789a}textarea{min-height:96px}button{padding:10px 15px;margin:15px 8px 0 0;border:0;background:#d8e7ff;color:#10213c;font-weight:bold;cursor:pointer}p{color:#b9cbe6;line-height:1.4}

.grid{grid-template-columns:350px minmax(0,1fr) 350px;align-items:stretch}
.lineup{padding:24px 20px;min-height:490px}
.row{grid-template-columns:45px minmax(0,1fr);font-size:23px;min-height:61px}
.row span:first-child{font-size:17px}
.rink{margin:0;position:relative;display:grid;grid-template-rows:1fr auto;overflow:hidden;border:1px solid #425677;background:radial-gradient(ellipse at center,#243f61,#0a1424 74%)}
.rink iframe{width:100%;height:100%;min-height:0;border:0;display:block;pointer-events:none}
.rink figcaption{padding:12px;text-align:center;color:#b9cbe6;font-size:17px;font-weight:700;letter-spacing:2px}

.lineup{padding:18px 20px;min-height:540px}
.lineup h2{margin-bottom:8px;font-size:20px}
.lineup .row{min-height:28px;font-size:18px}
.lineup .row span:first-child{font-size:14px}
.row.featured{background:#29415f;color:white}
.spotlight{width:206px;height:294px;margin:0 auto 11px;perspective:900px}
.spotlight-face{position:relative;width:100%;height:100%;border-radius:8px;background:linear-gradient(150deg,#263c5d,#0b1729);box-shadow:0 8px 24px #0009;overflow:hidden}
.spotlight canvas{position:absolute;inset:0;width:100%;height:100%}
.spotlight-fallback{position:absolute;inset:0;display:grid;place-content:center;gap:8px;padding:15px;text-align:center;font-size:24px}
.spotlight-fallback[hidden],.spotlight canvas[hidden]{display:none}
.spotlight-fallback small{color:#a8c2e8;font-size:15px}
.spotlight-face.deal{animation:card-deal .45s ease-out}
@keyframes card-deal{from{transform:rotateY(-15deg);opacity:.55}to{transform:rotateY(0);opacity:1}}
@media(prefers-reduced-motion:reduce){.spotlight-face.deal{animation:none}}
.czechia-wordmark img{display:block;width:360px;height:158px;object-fit:contain;object-position:left center}

<script>
const stage = document.querySelector('#stage');
const setup = document.querySelector('#setup');
const gameData = document.querySelector('#game-data');
const games = JSON.parse(gameData.textContent);
const key = new URLSearchParams(location.search).get('game');
const game = Object.hasOwn(games, key) ? games[key] : null;
if (!game) {
  stage.hidden = true;
  setup.hidden = false;
  for (const [slug, matchup] of Object.entries(games)) {
    const row = document.createElement('p');
    const url = new URL(location.pathname, location.origin);
    url.searchParams.set('game', slug);
    const preview = document.createElement('a');
    preview.href = url.href;
    preview.style.color = '#d8e7ff';
    preview.textContent = matchup.time + ' · ' + matchup.opponent;
    const copy = document.createElement('button');
    copy.type = 'button';
    copy.textContent = 'Copy OBS URL';
    copy.addEventListener('click', async () => {
      const status = document.querySelector('#copy-status');
      try {
        await navigator.clipboard.writeText(url.href);
        status.textContent = matchup.opponent + ' OBS URL copied.';
      } catch {
        status.textContent = url.href;
      }
    });
    row.append(preview, ' ', copy);
    document.querySelector('#games').append(row);
  }
}
function fit() {
  const scale = Math.min(innerWidth / 1920, innerHeight / 1080);
  stage.style.transform = `translate(${(innerWidth - 1920 * scale) / 2}px,${(innerHeight - 1080 * scale) / 2}px) scale(${scale})`;
}
function drawLineup(id, value) {
  const target = document.getElementById(id);
  const rows = value.split(/\r?\n/).map(line => line.trim()).filter(Boolean).slice(0, 6);
  target.replaceChildren();
  if (!rows.length) {
    const pending = document.createElement('p');
    pending.className = 'waiting';
    pending.textContent = 'Lineup awaiting confirmation';
    target.append(pending);
  }
  for (const line of rows) {
    const divider = line.indexOf('|');
    const row = document.createElement('div');
    row.className = 'row';
    const position = document.createElement('span');
    position.textContent = divider < 0 ? '' : line.slice(0, divider).trim();
    const name = document.createElement('span');
    name.textContent = line.slice(divider + 1).trim();
    name.style.overflowWrap = 'anywhere';
    row.append(position, name);
    target.append(row);
  }
}
function render() {
  const opponent = document.querySelector('#opponent');
  document.title = 'Czechia vs ' + game.opponent + ' | LG World Juniors';
  document.querySelector('#away-title').textContent = game.opponent + ' lineup';
  opponent.textContent = game.opponent.toUpperCase() || 'OPPONENT TBC';
  opponent.style.fontSize = opponent.textContent.length > 16 ? '57px' : '88px';
  document.querySelector('#air-time').textContent = game.time || 'CZECHIA • GAME NIGHT';
  drawLineup('czech', game.czech);
  drawLineup('away', game.away);
}
function mountRink() {
  const rink = document.querySelector('#pregame-rink');
  const caption = document.querySelector('#rink-caption');
  const slots = { LW: [9, -9], C: [4, 0], RW: [9, 9], LD: [17, -5], RD: [17, 5], G: [26, 0] };
  const markers = [game.czech, game.away].flatMap((lineup, side) =>
    lineup.split('\n').flatMap((line, index) => {
      const [position, name] = line.split('|').map(value => value.trim());
      const slot = slots[position];
      if (!slot || !name) return [];
      const direction = side === 0 ? -1 : 1;
      return [{
        id: side * 6 + index + 1, name, goalie: position === 'G',
        britain: side === 1, x: slot[0] * direction, z: slot[1] * direction,
      }];
    })
  );
  const timeout = setTimeout(() => {
    caption.textContent = 'RINK UNAVAILABLE · STARTING LINEUPS SHOWN';
  }, 8000);
  addEventListener('message', event => {
    if (event.origin !== location.origin || event.source !== rink.contentWindow ||
        event.data?.protocol !== 'lg3s:1' || event.data.type !== 'ready') return;
    rink.contentWindow.postMessage({
      protocol: 'lg3s:1',
      type: 'state',
      payload: {
        home_team: 'CZE', away_team: game.opponent, home_score: 0, away_score: 0,
        period: 'Pregame', clock: '—', active_formation: 'lineups', camera_angle: 'ice',
        kit_variant: 'royal_blue', jersey_side: 'front',
        pregame: { markers, highlighted: [] },
      },
    }, location.origin);
    clearTimeout(timeout);
    caption.textContent = 'CZECHIA IN RED · PREGAME LINEUP VISUALIZATION';
  });
  rink.src = '/assets/lg3s-world/rink-preview.html?embed=true&mode=obs&pregame=1&lineup=off';
}

function jerseyArt(primary, stripe, trim) {
  const canvas = document.createElement('canvas');
  canvas.width = 640;
  canvas.height = 580;
  const ctx = canvas.getContext('2d');
  const jersey = new Path2D('M227 52 L160 69 L50 166 L18 382 L132 405 L180 231 L172 526 Q320 555 468 526 L460 231 L508 405 L622 382 L590 166 L480 69 L413 52 Q320 138 227 52 Z');
  const cloth = ctx.createLinearGradient(40, 0, 600, 0);
  cloth.addColorStop(0, primary);
  cloth.addColorStop(.5, trim);
  cloth.addColorStop(1, primary);
  ctx.save();
  ctx.clip(jersey);
  ctx.fillStyle = cloth;
  ctx.fillRect(0, 0, 640, 580);
  ctx.fillStyle = stripe;
  for (const y of [333, 464]) ctx.fillRect(0, y, 640, 22);
  ctx.fillStyle = primary;
  ctx.fillRect(0, 488, 640, 80);
  ctx.restore();
  ctx.strokeStyle = '#e8f1ff66';
  ctx.lineWidth = 5;
  ctx.stroke(jersey);
  return canvas;
}
function startSpotlights() {
  const opponentJersey = {
    Germany: '/assets/lg3s/jerseys/532.webp',
    USA: '/assets/lg3s/jerseys/342.webp',
    Sweden: '/assets/lg3s/jerseys/343.webp',
  };
  const sides = [
    { id: 'czech', team: 'Czechia', lineup: game.czech },
    { id: 'away', team: game.opponent, lineup: game.away },
  ].map(side => ({
    ...side,
    jersey: opponentJersey[side.team] || jerseyArt('#9b1630', '#e9eff7', '#d5344b'),
    players: side.lineup.split('\n').filter(Boolean).map(line => line.split('|').map(value => value.trim())),
  }));
  let slot = 0;
  function show() {
    for (const side of sides) {
      if (!side.players.length) continue;
      const index = slot % side.players.length;
      const [pos, tag] = side.players[index];
      const face = document.createElement('div');
      face.className = 'spotlight-face deal';
      const fallback = document.createElement('div');
      fallback.className = 'spotlight-fallback';
      const label = document.createElement('small');
      label.textContent = side.team + ' · ' + pos;
      const name = document.createElement('strong');
      name.textContent = tag;
      fallback.append(label, name);
      const canvas = document.createElement('canvas');
      canvas.hidden = true;
      canvas.setAttribute('role', 'img');
      face.append(fallback, canvas);
      document.getElementById(side.id + '-card').replaceChildren(face);
      document.querySelectorAll('#' + side.id + ' .row').forEach((row, i) =>
        row.classList.toggle('featured', i === index));
      const card = {
        player: { team: side.team, pos, tag }, season: 'LG WORLD JUNIORS',
        ratingKind: 'pending', edition: 'season', finish: 'ice', background: 'arena',
        teamJersey: side.jersey, labels: pos === 'G' ? ['GP','SV','SV%','GAA'] : ['GP','G','A','PTS'],
        values: ['—','—','—','—'],
      };
      window.ECMCardRenderer?.draw(canvas, card).then(ok => {
        if (ok && face.isConnected) { canvas.hidden = false; fallback.hidden = true; }
      }).catch(() => {});
    }
    slot++;
  }
  show();
  setInterval(show, 8500);
}
if (game) {
  mountRink();
  addEventListener('resize', fit);
  fit();
  render();
  addEventListener('DOMContentLoaded', () => {
    Promise.allSettled([document.fonts.load('46px CardDisplay'), document.fonts.load('36px CardLabel')])
      .then(startSpotlights);
  }, { once: true });
}
</script>
</html>
