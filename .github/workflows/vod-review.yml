name: VOD management review
on:
  push:
    branches: [main, fix/vod-management-review, fix/vod-evidence-reconciliation, feature/grok-scouting-coding]
  pull_request:
    paths:
      - 'vod-*'
      - 'hitmen-player-locker*'
      - 'api/chelscout-deepthink.js'
      - 'api/chelstats-player.js'
      - 'test-vod-*'
      - 'test-fixtures/vod-hitmen-identity-reference.json'
      - 'docs/sql/vod_lg_identity.sql'
      - 'lib/vod-lineup-preflight.cjs'
      - 'scripts/vod-lineup-preflight.cjs'
      - 'lib/lg-platform-capture-dom.js'
      - 'scripts/capture-lg-platform-accounts.py'
      - 'scripts/export-lg-account-capture.py'
      - 'tests/test_vod_account_export.py'
      - 'api/vod-archive.js'
      - 'api/_s3presign.js'
      - 'test-deep-scout.cjs'
      - 'hitmen-gm-ai*'
      - 'lib/grok-client.cjs'
      - 'scripts/grok-code.cjs'
      - 'test-grok*.cjs'
      - '.github/workflows/vod-review.yml'
permissions:
  contents: read
jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node --test test-vod-review.cjs test-deep-scout.cjs
      - run: node --test test-vod-archive.mjs
      - run: node test-grok.cjs && node test-grok-code.cjs
      - run: npm install --prefix /tmp/vod-browser playwright@1.56.1 jsdom@26.1.0 @electric-sql/pglite@0.3.14
      - run: /tmp/vod-browser/node_modules/.bin/playwright install --with-deps chromium
      - name: LG identity and publication regression checks
        env:
          NODE_PATH: /tmp/vod-browser/node_modules
        run: |
          node test-vod-lg-identity.cjs
          node --test test-vod-lineup-preflight.cjs
          node --test test-vod-chel-account.cjs
          node --test test-vod-lg-capture.cjs
          python -B tests/test_vod_account_export.py
          node test-vod-player-matching.cjs
          node test-vod-restore.cjs
      - name: Management workflow browser checks
        env:
          NODE_PATH: /tmp/vod-browser/node_modules
        run: |
          export CHROMIUM_PATH="$(node -p 'require("playwright").chromium.executablePath()')"
          node test-vod-browser.cjs
          node test-grok-browser.cjs
